version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: talentmatch_db
    environment:
      POSTGRES_USER: talentmatch
      POSTGRES_PASSWORD: talentmatch123
      POSTGRES_DB: talentmatch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
